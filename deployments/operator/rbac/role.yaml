---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - deviceplugin.intel.com
  resources:
  - dsadeviceplugins
  - gpudeviceplugins
  - iaadeviceplugins
  - npudeviceplugins
  - qatdeviceplugins
  - sgxdeviceplugins
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - deviceplugin.intel.com
  resources:
  - dsadeviceplugins/finalizers
  - gpudeviceplugins/finalizers
  - iaadeviceplugins/finalizers
  - npudeviceplugins/finalizers
  - qatdeviceplugins/finalizers
  - sgxdeviceplugins/finalizers
  verbs:
  - update
- apiGroups:
  - deviceplugin.intel.com
  resources:
  - dsadeviceplugins/status
  - gpudeviceplugins/status
  - iaadeviceplugins/status
  - npudeviceplugins/status
  - qatdeviceplugins/status
  - sgxdeviceplugins/status
  verbs:
  - get
  - update
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  verbs:
  - use
