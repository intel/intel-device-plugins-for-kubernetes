# OCP-specific operator overlay used by the e2e tests (see DEVEL.md).
# Replaces cert-manager TLS with the OCP service-CA operator. Production
# installs on OCP use the OLM bundle instead.
namePrefix: intel-deviceplugins-

resources:
- ../../crd
- ../../rbac
- ../../manager
- ../../webhook

patches:
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
- path: webhook-service-patch.yaml
  target:
    kind: Service
    name: webhook-service
- path: webhook-mutating-ca-patch.yaml
  target:
    kind: MutatingWebhookConfiguration
- path: webhook-validating-ca-patch.yaml
  target:
    kind: ValidatingWebhookConfiguration
# remove namespace object as we don't want to create (and delete) it in OCP overlay
# In OCP, we must keep the namespace so the images within the ImageStream stay intact.
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      labels:
        control-plane: controller-manager
        manager: intel-deviceplugin-operator
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
      name: system

replacements:
# Inject the resolved plugin ServiceAccount name (namePrefix + "plugin") into
# the manager's DEVICEPLUGIN_SERVICEACCOUNT env var so that the DaemonSets the
# operator creates run under it.
- source:
    kind: ServiceAccount
    name: plugin
    fieldPath: metadata.name
  targets:
  - select:
      kind: Deployment
      name: controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=DEVICEPLUGIN_SERVICEACCOUNT].value
